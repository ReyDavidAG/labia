# Canal Desarrollo de macOS: cada push a develop que cambie la app rehace el release preliminar «desarrollo»
# con su Labia.app y su feed de Sparkle. Un push que sólo toca Windows o Linux no lo dispara.
name: Dev build

on:
  push:
    branches: [develop]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/bundle.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          test -n "$MAC_CERT_P12" || { echo "falta el secreto MAC_CERT_P12" >&2; exit 1; }
          scripts/import-cert.sh
      - name: Sparkle tools
        run: scripts/sparkle-tools.sh
      - name: Bundle
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          VERSION="${last#v}-dev.$(git rev-parse --short HEAD)" scripts/bundle.sh --zip
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/appcast.sh desarrollo
      - name: Publish
        run: |
          notes="Labia de \`develop\` ($(git rev-parse --short HEAD)) para el canal Desarrollo de macOS. Se rehace en cada cambio de la app; no es una versión publicada."
          if ! gh release view desarrollo >/dev/null 2>&1; then
            gh release create desarrollo --prerelease --latest=false --target develop --title "Desarrollo" --notes "$notes"
          fi
          gh release edit desarrollo --prerelease --latest=false --target "$GITHUB_SHA" --notes "$notes"
          gh release upload desarrollo dist/Labia-desarrollo.zip dist/appcast.xml --clobber
