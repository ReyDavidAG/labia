name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/bundle.sh --zip
      - name: Icon
        run: swift scripts/icon.swift dist/icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: Labia
          path: |
            dist/*.zip
            dist/icon.png
