name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/bundle.sh --zip
      - name: Icon
        run: swift scripts/icon.swift dist/icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: Labia
          path: |
            dist/*.zip
            dist/icon.png

  # Windows and Linux run the same Python package (linux/labia). Tests only need numpy and sounddevice,
  # not faster-whisper or the CUDA wheels (~2.5 GB).
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libportaudio2
      - name: Dependencies
        run: python -m pip install numpy==2.5.4 sounddevice==0.5.6 pytest
      - name: Test
        run: python -m pytest -q
