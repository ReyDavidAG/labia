# Publica una versión al subir su tag vX.Y.Z a main (RELEASING.md): pruebas, Labia.app firmada, el feed de
# Sparkle y el release de GitHub marcado como «Latest». Windows y Linux se actualizan desde el tag con git.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libportaudio2
      - name: Dependencies
        run: python -m pip install numpy==2.5.4 sounddevice==0.5.6 pytest
      - name: Test
        run: python -m pytest -q

  release:
    needs: python
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          test -n "$MAC_CERT_P12" || { echo "falta el secreto MAC_CERT_P12" >&2; exit 1; }
          scripts/import-cert.sh
      - name: Sparkle tools
        run: scripts/sparkle-tools.sh
      - name: Bundle
        run: VERSION="${TAG#v}" scripts/bundle.sh --zip
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/appcast.sh estable
      - name: Notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "CHANGELOG.md no tiene la sección «## $version»" >&2; exit 1; }
          (cd dist && shasum -a 256 Labia-*.zip appcast.xml > SHA256SUMS)
      - name: Publish
        run: |
          files=(dist/Labia-*.zip dist/appcast.xml dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file dist/notes.md --latest
          else
            gh release create "$TAG" "${files[@]}" --title "Labia ${TAG#v}" --notes-file dist/notes.md --latest --verify-tag
          fi
